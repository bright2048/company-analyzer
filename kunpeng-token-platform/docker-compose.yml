version: '3.8'

services:
  kunpeng:
    build: .
    container_name: kunpeng-token-platform
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ADDR=0.0.0.0:8080
      - STORAGE_BACKEND=memory
      - PLATFORM_ADMIN_TOKEN=${PLATFORM_ADMIN_TOKEN:-kp-admin-change-me}
      - LOG_LEVEL=info
      - STATIC_DIR=./static
    volumes:
      - kunpeng-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：Nginx反向代理（生产环境推荐）
  nginx:
    image: nginx:alpine
    container_name: kunpeng-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/ssl:/etc/nginx/ssl
    depends_on:
      - kunpeng
    profiles:
      - production

volumes:
  kunpeng-data:
